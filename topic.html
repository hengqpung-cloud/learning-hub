<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materi - Retail Excellence Learning Hub</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Pustaka Ikon FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Library Marked.js untuk parsing Markdown ke HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body>

    <!-- Navbar Atas Navigation -->
    <nav class="navbar-top">
        <div class="navbar-left">
            <a href="index.html" class="nav-brand" title="Beranda Learning Hub">
                <span class="brand-accent">INFORMA</span> Hub
            </a>
            <a href="index.html" class="nav-icon-btn" title="Kembali ke Beranda Learning Hub" aria-label="Kembali ke Beranda Learning Hub" style="margin-left: 0.5rem;">
                <i class="fa-solid fa-house"></i>
            </a>
            <a href="glossary.html" class="nav-icon-btn" title="Kamus Glosarium &amp; Istilah Retail" aria-label="Kamus Glosarium">
                <i class="fa-solid fa-book-bookmark"></i>
            </a>
        </div>
        <div class="navbar-right">
            <button class="nav-icon-btn sidebar-toggle-btn" onclick="toggleMobileSidebar()" id="sidebar-toggle-btn" title="Buka Daftar Materi Kurikulum" aria-label="Buka Daftar Materi Kurikulum">
                <i class="fa-solid fa-book-open"></i>
            </button>
            <div id="topic-user-container" style="display: flex; align-items: center; gap: 0.5rem;"></div>
            <button class="nav-icon-btn theme-toggle-btn" onclick="toggleTheme()" id="theme-btn" title="Mode Gelap (Klik untuk Mode Terang)" aria-label="Mode Gelap, klik untuk ganti ke Mode Terang">
                <i class="fa-solid fa-sun"></i>
            </button>
        </div>
    </nav>

    <!-- Layout Split Screen -->
    <div class="app-container">
        
        <!-- Kolom Kiri: Sidebar Navigasi -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header" style="display: flex; justify-content: space-between; align-items: center;">
                <span>Daftar Materi</span>
                <button class="sidebar-close-btn" onclick="toggleMobileSidebar()" aria-label="Tutup menu" style="background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-color); display: none;">✕</button>
            </div>
            <div id="sidebar-content">
                <!-- Navigasi akan dimuat oleh JavaScript -->
                <div style="padding: 1.5rem;">Memuat daftar materi...</div>
            </div>
        </aside>
        
        <!-- Backdrop untuk Off-Canvas Drawer di mobile -->
        <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="toggleMobileSidebar()"></div>

        <!-- Kolom Kanan: Area Konten Utama -->
        <main class="main-content">
            <div class="content-card">
                <div id="markdown-content" class="markdown-body">
                    <p>Memuat materi...</p>
                </div>
                
                <div class="content-footer" id="content-footer" style="display: none;">
                    <button class="btn-success" onclick="markDoneAndContinue()">
                        Tandai Selesai & Lanjutkan <span>➔</span>
                    </button>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal Kategori 100% Selesai -->
    <div class="modal-overlay" id="completion-modal">
        <div class="modal-content">
            <h2>✨ Luar Biasa!</h2>
            <p>Selamat! Kategori ini telah Anda selesaikan 100%. Modul Evaluasi Kategori kini telah terbuka di Halaman Utama!</p>
            <button class="btn-primary" onclick="window.location.href='index.html'">Kembali ke Beranda</button>
        </div>
    </div>

    <!-- Skrip Inti -->
    <script>
        // Ambil parameter URL
        const urlParams = new URLSearchParams(window.location.search);
        const currentCategory = urlParams.get('category');
        const currentTopic = urlParams.get('topic'); // Ini adalah topicId
        
        let globalNavData = [];
        let currentFileName = null; // Menyimpan nama file asli (berikut ekstensinya)

        function renderTopicUserBadge(user) {
            const container = document.getElementById('topic-user-container');
            if (!container) return;
            if (!user) {
                container.innerHTML = `
                    <a href="index.html" class="btn-login">
                        <i class="fa-solid fa-key"></i> <span>Masuk</span>
                    </a>
                `;
                return;
            }

            const firstName = user.name ? user.name.split(' ')[0] : 'User';
            const initial = user.name ? user.name.charAt(0).toUpperCase() : 'U';

            let hrdLinkHTML = '';
            if (user.role === 'hrd') {
                hrdLinkHTML = `<a href="dashboard.html" class="btn-hrd-portal"><i class="fa-solid fa-chart-line"></i> Portal HRD</a>`;
            }

            container.innerHTML = `
                ${hrdLinkHTML}
                <a href="profile.html" class="user-badge-btn" title="Lihat Profil &amp; Pencapaian (${user.name})" style="text-decoration:none;">
                    <span class="user-avatar-circle">${initial}</span>
                    <span>${firstName}</span>
                </a>
                <button class="btn-logout" onclick="handleLogout()" title="Keluar / Logout Akun">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                </button>
            `;
        }

        function handleLogout() {
            if (confirm("Apakah Anda yakin ingin keluar dari akun ini?")) {
                logoutUser();
                window.location.href = 'index.html';
            }
        }

        // Fungsi utama saat halaman dimuat
        async function initPage() {
            // Proteksi Opsi 1: Wajib Login sebelum membaca topik materi
            const currentUser = getCurrentUser();
            if (!currentUser) {
                alert("Anda belum mengisi identitas. Silakan isi identitas Anda terlebih dahulu untuk membaca materi.");
                window.location.replace('index.html');
                return;
            }
            renderTopicUserBadge(currentUser);

            try {
                // 1. Muat nav.json terlebih dahulu untuk Sidebar dan default redirection
                const navResponse = await fetch('nav.json');
                if (!navResponse.ok) throw new Error('Gagal memuat nav.json');
                globalNavData = await navResponse.json();
                
                // Jika dibuka langsung tanpa parameter URL, otomatis alihkan ke materi pertama!
                if (!currentCategory || !currentTopic) {
                    if (globalNavData.length > 0 && globalNavData[0].items && globalNavData[0].items.length > 0) {
                        const firstCat = globalNavData[0].folderName;
                        const firstTop = globalNavData[0].items[0].topicId;
                        window.location.replace(`topic?category=${firstCat}&topic=${firstTop}`);
                        return;
                    } else {
                        document.getElementById('markdown-content').innerHTML = `
                            <h1>Materi Tidak Ditemukan</h1>
                            <p>Parameter URL tidak lengkap dan tidak dapat menemukan materi default.</p>
                            <a href="index.html" class="btn-primary" style="display:inline-block; margin-top:1rem; text-decoration:none;">Kembali ke Beranda</a>
                        `;
                        return;
                    }
                }
                
                // Cari nama file aslinya (agar mendukung .md maupun .mdx)
                globalNavData.forEach(cat => {
                    if (cat.folderName === currentCategory && cat.items) {
                        const found = cat.items.find(item => item.topicId === currentTopic);
                        if (found) {
                            currentFileName = found.fileName;
                        }
                    }
                });

                if (!currentFileName) {
                    throw new Error(`Materi dengan ID ${currentTopic} tidak ditemukan di kurikulum.`);
                }

                renderSidebar(globalNavData);

                // 2. Ambil file Markdown materi saat ini
                const mdPath = `content/${currentCategory}/${currentFileName}`;
                const mdResponse = await fetch(mdPath);
                
                if (!mdResponse.ok) {
                    throw new Error(`Gagal memuat file materi: ${mdPath}`);
                }

                // 3. Render Markdown ke HTML
                let mdText = await mdResponse.text();
                
                // Hapus block YAML Frontmatter (--- ... ---) di bagian atas file
                if (mdText.trim().startsWith('---')) {
                    const endMatch = mdText.indexOf('---', 3);
                    if (endMatch !== -1) {
                        mdText = mdText.substring(endMatch + 3).trim();
                    }
                }

                document.getElementById('markdown-content').innerHTML = marked.parse(mdText);
                
                // 4. Tampilkan tombol Selesai
                document.getElementById('content-footer').style.display = 'flex';

            } catch (error) {
                console.error(error);
                document.getElementById('markdown-content').innerHTML = `
                    <h1 style="color:var(--informa-red)">Terjadi Kesalahan</h1>
                    <p>${error.message}</p>
                    <p>Pastikan Anda membuka file ini lewat Local Web Server (misalnya VSCode Live Server) agar fetch() berfungsi.</p>
                `;
            }
        }

        // Fungsi merender Sidebar Navigasi
        function renderSidebar(navData) {
            const sidebarContainer = document.getElementById('sidebar-content');
            sidebarContainer.innerHTML = ''; // bersihkan

            // Ambil daftar materi yang sudah selesai dari LocalStorage
            let readTopics = JSON.parse(localStorage.getItem('informa_read_topics')) || [];

            navData.forEach(category => {
                // Kalkulasi Progress Khusus Kategori yang sedang aktif dibaca
                let isCurrentCat = (category.folderName === currentCategory);
                let catTotal = category.items ? category.items.length : 0;
                let catReadCount = 0;
                
                if (category.items) {
                    category.items.forEach(t => {
                        if (readTopics.includes(t.topicId)) catReadCount++;
                    });
                }
                
                const catPercentage = catTotal === 0 ? 0 : Math.round((catReadCount / catTotal) * 100);

                // Buat Header Kategori (Bisa diklik untuk toggle)
                const catHeader = document.createElement('div');
                catHeader.className = 'sidebar-category';
                catHeader.style.cursor = 'pointer';
                catHeader.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span>${category.category}</span>
                        <span style="font-size:0.8em; transform: ${isCurrentCat ? 'rotate(180deg)' : 'rotate(0deg)'}; transition: transform 0.3s;">▼</span>
                    </div>
                `;
                sidebarContainer.appendChild(catHeader);

                // Container untuk isi (progress + topics)
                const contentContainer = document.createElement('div');
                contentContainer.className = 'sidebar-category-content';
                contentContainer.style.display = isCurrentCat ? 'block' : 'none';
                sidebarContainer.appendChild(contentContainer);

                // Klik header untuk toggle accordion (Exclusive Accordion untuk Mobile & Desktop)
                catHeader.onclick = () => {
                    const isExpanded = contentContainer.style.display === 'block';
                    
                    // 1. Tutup semua kategori di sidebar terlebih dahulu
                    document.querySelectorAll('.sidebar-category-content').forEach(el => {
                        el.style.display = 'none';
                    });
                    document.querySelectorAll('.sidebar-category span:nth-child(2)').forEach(icon => {
                        icon.style.transform = 'rotate(0deg)';
                    });
                    
                    // 2. Jika kategori yang diklik sebelumnya tertutup, maka buka
                    if (!isExpanded) {
                        contentContainer.style.display = 'block';
                        catHeader.querySelector('span:nth-child(2)').style.transform = 'rotate(180deg)';
                    }
                };
                
                // Tambahkan Progress Bar Khusus untuk Kategori (hanya jika ada progress atau sedang aktif)
                // Kita selalu tambahkan agar saat expand terlihat
                if (catTotal > 0) {
                    const progContainer = document.createElement('div');
                    progContainer.className = 'sidebar-progress';
                    progContainer.innerHTML = `
                        <div class="category-progress-text" style="margin-bottom: 0.5rem; display:flex; justify-content:space-between; font-size:0.85rem; color:var(--text-muted); font-weight:600;">
                            <span>Progres Kategori</span>
                            <span>${catPercentage}%</span>
                        </div>
                        <div class="mini-progress-bar">
                            <div class="mini-progress-fill" style="width: ${catPercentage}%"></div>
                        </div>
                    `;
                    contentContainer.appendChild(progContainer);
                }

                // Buat Daftar Topik di bawah Kategori
                if (category.items && category.items.length > 0) {
                    category.items.forEach(topic => {
                        const link = document.createElement('a');
                        const isCurrentTopic = (category.folderName === currentCategory && topic.topicId === currentTopic);
                        const isCompleted = readTopics.includes(topic.topicId);

                        link.className = `sidebar-topic ${isCurrentTopic ? 'active' : ''}`;
                        link.href = `topic?category=${category.folderName}&topic=${topic.topicId}`;
                        
                        // Isi konten link
                        link.innerHTML = `
                            <span>${topic.title}</span>
                            ${isCompleted ? '<span class="icon-check">✓</span>' : ''}
                        `;

                        // Scroll otomatis sidebar ke topik yang aktif
                        if (isCurrentTopic) {
                            setTimeout(() => link.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
                        }

                        contentContainer.appendChild(link);
                    });
                }
            });
        }

        // Fungsi "Tandai Selesai & Lanjutkan"
        function markDoneAndContinue() {
            // 1. Cek progress SEBELUM ditandai
            let readTopics = JSON.parse(localStorage.getItem('informa_read_topics')) || [];
            const activeCategoryObj = globalNavData.find(cat => cat.folderName === currentCategory);
            const totalInCat = activeCategoryObj && activeCategoryObj.items ? activeCategoryObj.items.length : 0;
            
            let readCountBefore = 0;
            if (activeCategoryObj && activeCategoryObj.items) {
                activeCategoryObj.items.forEach(t => {
                    if (readTopics.includes(t.topicId)) readCountBefore++;
                });
            }

            // 2. Simpan currentTopic ke LocalStorage jika belum ada
            if (currentTopic && !readTopics.includes(currentTopic)) {
                readTopics.push(currentTopic);
                localStorage.setItem('informa_read_topics', JSON.stringify(readTopics));
                syncProgressToFirestore();
            }

            // 3. Cek progress SESUDAH ditandai
            let readCountAfter = 0;
            if (activeCategoryObj && activeCategoryObj.items) {
                activeCategoryObj.items.forEach(t => {
                    if (readTopics.includes(t.topicId)) readCountAfter++;
                });
            }

            // 4. Update Sidebar UI agar checklist langsung muncul
            renderSidebar(globalNavData);

            // 5. Cek apakah ini aksi yang membuat kategori jadi 100%
            if (readCountAfter === totalInCat && readCountBefore < totalInCat) {
                // Tampilkan Modal Glassmorphism 100% Selesai!
                document.getElementById('completion-modal').classList.add('show');
                return; // Jangan redirect, tunggu user klik tombol di modal
            }

            // 6. Jika tidak 100% baru, cari materi berikutnya
            const nextLink = getNextTopicLink();
            
            if (nextLink) {
                window.location.href = nextLink;
            } else {
                // Jika sudah materi benar-benar terakhir di seluruh kurikulum
                document.getElementById('completion-modal').classList.add('show');
            }
        }

        // Fungsi mencari link untuk materi berikutnya
        function getNextTopicLink() {
            // Ratakan (flatten) seluruh urutan materi ke dalam satu array linear
            const flatTopics = [];
            globalNavData.forEach(cat => {
                if (cat.items) {
                    cat.items.forEach(item => {
                        flatTopics.push({
                            category: cat.folderName,
                            topic: item.topicId
                        });
                    });
                }
            });

            // Cari indeks materi saat ini
            const currentIndex = flatTopics.findIndex(
                t => t.category === currentCategory && t.topic === currentTopic
            );

            // Jika ketemu dan belum di ujung, kembalikan URL materi berikutnya
            if (currentIndex !== -1 && currentIndex < flatTopics.length - 1) {
                const next = flatTopics[currentIndex + 1];
                return `topic?category=${next.category}&topic=${next.topic}`;
            }
            
            return null; // Tidak ada materi berikutnya (Selesai semua)
        }

        // --- Fitur Tema (Dark/Light Mode) ---
        function initTheme() {
            const savedTheme = localStorage.getItem('informa_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeButtonText(savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('informa_theme', newTheme);
            updateThemeButtonText(newTheme);
        }

        function updateThemeButtonText(theme) {
            const btn = document.getElementById('theme-btn');
            if (!btn) return;
            if (theme === 'light') {
                btn.innerHTML = '<i class="fa-solid fa-moon"></i>';
                btn.setAttribute('title', 'Mode Terang (Klik untuk Mode Gelap)');
                btn.setAttribute('aria-label', 'Mode Terang, klik untuk ganti ke Mode Gelap');
            } else {
                btn.innerHTML = '<i class="fa-solid fa-sun"></i>';
                btn.setAttribute('title', 'Mode Gelap (Klik untuk Mode Terang)');
                btn.setAttribute('aria-label', 'Mode Gelap, klik untuk ganti ke Mode Terang');
            }
        }

        // --- Fitur Toggle Off-Canvas Drawer (Mobile) ---
        function toggleMobileSidebar() {
            const sidebar = document.getElementById('sidebar');
            const backdrop = document.getElementById('sidebar-backdrop');
            if (sidebar && backdrop) {
                sidebar.classList.toggle('open');
                backdrop.classList.toggle('active');
            }
        }

        // Jalankan saat halaman dimuat
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            initPage();
        });
    </script>
</body>
</html>
