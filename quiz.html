<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evaluasi Kategori - Retail Excellence Learning Hub</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Pustaka Ikon FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
</head>
<body>
    <!-- Navbar Atas Navigation -->
    <nav class="navbar-top">
        <div class="navbar-left">
            <a href="index.html" class="nav-brand" title="Beranda Learning Hub">
                <span class="brand-accent">INFORMA</span> Hub
            </a>
            <a href="index.html" class="nav-icon-btn" title="Kembali ke Beranda Learning Hub" aria-label="Kembali ke Beranda Learning Hub" style="margin-left: 0.5rem;">
                <i class="fa-solid fa-house"></i>
            </a>
        </div>
        <div class="navbar-right">
            <div id="quiz-user-container" style="display: flex; align-items: center; gap: 0.5rem;"></div>
            <button class="nav-icon-btn theme-toggle-btn" onclick="toggleTheme()" id="theme-btn" title="Mode Gelap (Klik untuk Mode Terang)" aria-label="Mode Gelap, klik untuk ganti ke Mode Terang">
                <i class="fa-solid fa-sun"></i>
            </button>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="container" style="display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 150px);">
        
        <div class="quiz-card" id="quiz-container">
            <!-- Loading State -->
            <div id="quiz-loading" style="text-align: center;">
                <h2 style="font-family: 'Playfair Display', serif; margin-bottom: 1rem;">Mempersiapkan Evaluasi...</h2>
            </div>
            
            <!-- Error State -->
            <div id="quiz-error" style="display: none; text-align: center;">
                <h2 style="font-family: 'Playfair Display', serif; color: var(--informa-red); margin-bottom: 1rem;">Mohon Maaf</h2>
                <p style="color: var(--text-muted); margin-bottom: 2rem;">Soal evaluasi untuk kategori ini sedang dipersiapkan oleh team.</p>
                <button class="btn-primary" onclick="window.location.href='index.html'">Kembali ke Beranda</button>
            </div>

            <!-- Quiz UI -->
            <div id="quiz-ui" style="display: none;">
                <div class="quiz-top-info">
                    <div>
                        <span id="quiz-progress-text" style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">Soal 1 dari 10</span>
                        <h2 id="quiz-title" style="font-family: 'Playfair Display', serif; margin-top: 0.2rem; font-size: 1.5rem; color: var(--informa-red);">Evaluasi Kategori</h2>
                    </div>
                    <div style="display: flex; align-items: center; gap: 0.75rem;">
                        <span style="font-size: 0.82rem; color: var(--text-muted); font-weight: 600;" title="Estimasi waktu pengerjaan">⏱️ ~5 Menit</span>
                        <span class="quiz-timer-badge" id="quiz-timer-display" title="Waktu pengerjaan"><i class="fa-regular fa-clock"></i> <span id="timer-text">00:00</span></span>
                    </div>
                </div>

                <!-- Question Navigator Pills (Fitur #5) -->
                <div class="quiz-nav-pills" id="quiz-nav-pills"></div>
                
                <div class="quiz-question" id="quiz-question">
                    Pertanyaan akan muncul di sini?
                </div>
                
                <div class="quiz-options" id="quiz-options">
                    <!-- Opsi akan di-generate via JS -->
                </div>

                <!-- Explanation Container (Fitur #9) -->
                <div id="explanation-container"></div>

                <!-- Review Navigation (Hidden by default) -->
                <div id="review-nav" style="display: none; justify-content: space-between; margin-top: 2rem; border-top: 1px solid var(--card-border); padding-top: 1.5rem;">
                    <button class="btn-primary" style="background-color: var(--card-expanded-bg); color: var(--text-color); border: 1px solid var(--card-border); box-shadow: none;" onclick="prevReview()">⬅ Sebelumnya</button>
                    <button class="btn-primary" id="review-next-btn" onclick="nextReview()">Selanjutnya ➔</button>
                </div>
            </div>

            <!-- Quiz Result UI -->
            <div id="quiz-result" style="display: none; text-align: center;">
                <h2 id="result-title" style="font-family: 'Playfair Display', serif; margin-bottom: 1rem; font-size: 2.5rem;">Evaluasi Selesai!</h2>
                <div class="score-circle" id="score-circle">
                    <span id="final-score">0</span>
                </div>
                <p id="result-message" style="color: var(--text-muted); margin: 2rem 0; font-size: 1.1rem;"></p>
                <!-- Tombol kondisi LULUS -->
                <div id="result-actions-passed" style="display: none;">
                    <button class="btn-primary" style="width: 100%; margin-bottom: 1rem;" onclick="window.location.href='index.html'">Selesai &amp; Kembali</button>
                    <button class="btn-primary" style="width: 100%; background-color: transparent; border: 1px solid var(--card-border); color: var(--text-color); box-shadow: none;" onclick="startReviewMode()">🔍 Tinjau Jawaban</button>
                </div>
                <!-- Tombol kondisi GAGAL -->
                <div id="result-actions-failed" style="display: none;">
                    <button class="btn-primary" style="width: 100%; margin-bottom: 1rem;" onclick="retakeQuiz()">🔄 Ulangi Quiz</button>
                    <button class="btn-primary" style="width: 100%; background-color: transparent; border: 1px solid var(--card-border); color: var(--text-color); box-shadow: none;" onclick="startReviewMode()">🔍 Tinjau Jawaban</button>
                </div>
            </div>
        </div>

    </main>

    <!-- Skrip Inti -->
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const currentCategory = urlParams.get('category');
        
        const PASSING_GRADE = 70;

        let questions = [];
        let currentIndex = 0;
        let score = 0;
        let userAnswers = [];
        let isReviewMode = false;

        function renderQuizUserBadge(user) {
            const container = document.getElementById('quiz-user-container');
            if (!container) return;
            if (!user) {
                container.innerHTML = `
                    <a href="index.html" class="btn-login">
                        <i class="fa-solid fa-key"></i> <span>Masuk</span>
                    </a>
                `;
                return;
            }

            const firstName = user.name ? user.name.split(' ')[0] : 'User';
            const initial = user.name ? user.name.charAt(0).toUpperCase() : 'U';

            let hrdLinkHTML = '';
            if (user.role === 'hrd') {
                hrdLinkHTML = `<a href="dashboard.html" class="btn-hrd-portal" title="Portal HRD"><i class="fa-solid fa-chart-line"></i> <span>Portal HRD</span></a>`;
            }

            container.innerHTML = `
                ${hrdLinkHTML}
                <a href="profile.html" class="user-badge-btn" title="Lihat Profil &amp; Pencapaian (${user.name})" style="text-decoration:none;">
                    <span class="user-avatar-circle">${initial}</span>
                    <span>${firstName}</span>
                </a>
                <button class="btn-logout" onclick="handleLogout()" title="Keluar / Logout Akun">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                </button>
            `;
        }

        function handleLogout() {
            if (confirm("Apakah Anda yakin ingin keluar dari akun ini?")) {
                logoutUser();
                window.location.href = 'index.html';
            }
        }

        let timerInterval = null;
        let secondsElapsed = 0;

        function startQuizTimer() {
            secondsElapsed = 0;
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
                const secs = (secondsElapsed % 60).toString().padStart(2, '0');
                const timerEl = document.getElementById('timer-text');
                if (timerEl) timerEl.innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function stopQuizTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }

        // Helper Fisher-Yates shuffle
        function shuffleArray(arr) {
            const array = [...arr];
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Fitur #8: Acak Soal & Pilihan Jawaban tanpa merusak kunci jawaban
        function prepareShuffledQuestions(rawQuestions) {
            // 1. Acak urutan soal
            const shuffledQs = shuffleArray(rawQuestions);

            // 2. Acak pilihan jawaban A/B/C/D per soal
            return shuffledQs.map(q => {
                const optionEntries = Object.entries(q.pilihan || {});
                const correctText = q.pilihan[q.jawaban_benar];

                // Acak opsi
                const shuffledOptions = shuffleArray(optionEntries);
                
                const newPilihan = {};
                let newJawabanBenar = 'A';
                const keys = ['A', 'B', 'C', 'D'];

                shuffledOptions.forEach((opt, idx) => {
                    const newKey = keys[idx] || opt[0];
                    newPilihan[newKey] = opt[1];
                    if (opt[1] === correctText) {
                        newJawabanBenar = newKey;
                    }
                });

                return {
                    ...q,
                    pilihan: newPilihan,
                    jawaban_benar: newJawabanBenar
                };
            });
        }

        async function initQuiz() {
            // Proteksi Opsi 1: Wajib Login sebelum mengerjakan quiz
            const currentUser = getCurrentUser();
            if (!currentUser) {
                alert("Anda belum mengisi identitas. Silakan isi identitas Anda terlebih dahulu untuk mengerjakan kuis evaluasi.");
                window.location.replace('index.html');
                return;
            }
            renderQuizUserBadge(currentUser);

            if (!currentCategory) {
                window.location.replace('quiz?category=basic-service');
                return;
            }

            try {
                // Konversi nama file sesuai nama kategori (misal: basic-service -> quiz-basic-service.json)
                const response = await fetch(`quiz-${currentCategory}.json`);
                if (!response.ok) throw new Error('File kuis tidak ditemukan');
                
                const rawQuestions = await response.json();
                
                if (rawQuestions.length === 0) {
                    throw new Error('Tidak ada soal');
                }

                // Fitur #8: Acak soal & pilihan
                questions = prepareShuffledQuestions(rawQuestions);

                document.getElementById('quiz-title').innerText = `Evaluasi: ${formatTitle(currentCategory)}`;
                
                document.getElementById('quiz-loading').style.display = 'none';
                document.getElementById('quiz-ui').style.display = 'block';
                
                startQuizTimer();
                renderQuestion();

            } catch (error) {
                console.error(error);
                showError();
            }
        }

        function formatTitle(str) {
            return str.split('-').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        }

        function showError() {
            document.getElementById('quiz-loading').style.display = 'none';
            document.getElementById('quiz-ui').style.display = 'none';
            document.getElementById('quiz-error').style.display = 'block';
        }

        // Fitur #5: Navigator Pills (1-10)
        function renderQuestionPills() {
            const container = document.getElementById('quiz-nav-pills');
            if (!container) return;

            container.innerHTML = '';
            questions.forEach((q, idx) => {
                const pill = document.createElement('div');
                pill.className = 'q-pill';

                if (idx === currentIndex) {
                    pill.classList.add('active');
                } else if (userAnswers[idx] !== undefined) {
                    pill.classList.add('answered');
                }

                pill.innerText = idx + 1;
                pill.title = `Soal ${idx + 1}`;

                // Klik pill untuk melompat antar soal
                pill.onclick = () => {
                    currentIndex = idx;
                    renderQuestion();
                };

                container.appendChild(pill);
            });
        }

        function renderQuestion() {
            const q = questions[currentIndex];
            renderQuestionPills();
            
            if (isReviewMode) {
                document.getElementById('quiz-progress-text').innerText = `Review Soal ${currentIndex + 1} dari ${questions.length}`;
                const nextBtn = document.getElementById('review-next-btn');
                if (currentIndex === questions.length - 1) {
                    nextBtn.innerText = 'Selesai Evaluasi';
                } else {
                    nextBtn.innerText = 'Selanjutnya ➔';
                }
            } else {
                document.getElementById('quiz-progress-text').innerText = `Soal ${currentIndex + 1} dari ${questions.length}`;
            }

            document.getElementById('quiz-question').innerText = q.pertanyaan;
            
            const optionsContainer = document.getElementById('quiz-options');
            optionsContainer.innerHTML = ''; // Bersihkan opsi sebelumnya
            
            for (const [key, text] of Object.entries(q.pilihan)) {
                const btn = document.createElement('button');
                btn.className = 'quiz-option-btn';
                if (isReviewMode) btn.classList.add('opt-disabled');
                
                let iconHtml = '';

                if (isReviewMode) {
                    const userAnswer = userAnswers[currentIndex];
                    const isCorrectAnswer = (key === q.jawaban_benar);
                    const isSelectedAnswer = (key === userAnswer);

                    if (isSelectedAnswer && isCorrectAnswer) {
                        btn.classList.add('opt-correct');
                        iconHtml = '<span style="margin-left:auto; font-size:1.2rem;">✅</span>';
                    } else if (isSelectedAnswer && !isCorrectAnswer) {
                        btn.classList.add('opt-incorrect');
                        iconHtml = '<span style="margin-left:auto; font-size:1.2rem;">❌</span>';
                    } else if (isCorrectAnswer && !isSelectedAnswer) {
                        // Highlight yang seharusnya benar
                        btn.style.borderColor = 'rgba(25, 135, 84, 0.5)';
                        btn.style.backgroundColor = 'rgba(25, 135, 84, 0.02)';
                    }
                } else if (userAnswers[currentIndex] === key) {
                    btn.style.borderColor = 'var(--informa-red)';
                }
                
                btn.innerHTML = `<span class="opt-key">${key}</span> <span class="opt-text">${text}</span> ${iconHtml}`;
                
                if (!isReviewMode) {
                    btn.onclick = () => handleAnswer(key, q.jawaban_benar);
                }
                
                optionsContainer.appendChild(btn);
            }

            // Fitur #9: Penjelasan Edukatif di Mode Review
            renderExplanationBox(q);
        }

        function renderExplanationBox(q) {
            const expContainer = document.getElementById('explanation-container');
            if (!expContainer) return;

            if (isReviewMode) {
                const defaultExp = `Jawaban yang benar adalah <strong>${q.jawaban_benar}</strong>. Pahami konsep dasar materi ${formatTitle(currentCategory)} untuk selalu memberikan standar pelayanan terbaik khas Informa.`;
                const text = q.penjelasan || defaultExp;

                expContainer.innerHTML = `
                    <div class="explanation-box">
                        <div class="exp-title"><i class="fa-solid fa-lightbulb"></i> Penjelasan / Pembahasan Soal:</div>
                        <div class="exp-content">${text}</div>
                    </div>
                `;
            } else {
                expContainer.innerHTML = '';
            }
        }

        function handleAnswer(selectedKey, correctKey) {
            userAnswers[currentIndex] = selectedKey;
            
            // Hitung ulang skor total
            score = 0;
            userAnswers.forEach((ans, idx) => {
                if (ans === questions[idx].jawaban_benar) score++;
            });
            
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                stopQuizTimer();
                showResult();
            }
        }

        function startReviewMode() {
            isReviewMode = true;
            currentIndex = 0;
            document.getElementById('quiz-result').style.display = 'none';
            document.getElementById('quiz-ui').style.display = 'block';
            document.getElementById('review-nav').style.display = 'flex';
            renderQuestion();
        }

        function nextReview() {
            if (currentIndex < questions.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                window.location.href = 'index.html';
            }
        }

        function prevReview() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function retakeQuiz() {
            // Reset state quiz
            currentIndex = 0;
            score = 0;
            userAnswers = [];
            isReviewMode = false;
            
            // Re-shuffle questions and options
            questions = prepareShuffledQuestions(questions);

            document.getElementById('quiz-result').style.display = 'none';
            document.getElementById('quiz-ui').style.display = 'block';
            document.getElementById('review-nav').style.display = 'none';
            startQuizTimer();
            renderQuestion();
        }

        function showResult() {
            document.getElementById('quiz-ui').style.display = 'none';
            document.getElementById('quiz-result').style.display = 'block';

            const finalScore = Math.round((score / questions.length) * 100);
            const isPassed = finalScore >= PASSING_GRADE;

            // Animasi angka skor
            let currentDisplay = 0;
            const scoreEl = document.getElementById('final-score');
            const interval = setInterval(() => {
                if (currentDisplay >= finalScore) {
                    clearInterval(interval);
                    scoreEl.innerText = finalScore;
                } else {
                    currentDisplay += 2;
                    scoreEl.innerText = currentDisplay;
                }
            }, 20);

            const scoreCircle = document.getElementById('score-circle');
            const resultTitle = document.getElementById('result-title');
            const resultMsg = document.getElementById('result-message');

            if (isPassed) {
                // --- Kondisi LULUS ---
                scoreCircle.classList.remove('failed');
                resultTitle.innerText = 'Evaluasi Selesai! 🎉';

                let msg = '';
                if (finalScore >= 90) msg = 'Luar biasa! Anda telah menguasai materi ini dengan sangat baik.';
                else if (finalScore >= 80) msg = 'Kerja bagus! Penguasaan materi Anda sudah di atas standar.';
                else msg = 'Selamat, Anda lulus! Terus tingkatkan pemahaman Anda.';
                resultMsg.innerText = msg;

                document.getElementById('result-actions-passed').style.display = 'block';
                document.getElementById('result-actions-failed').style.display = 'none';

                // Simpan skor dan flag lulus ke localStorage
                localStorage.setItem(`informa_quiz_${currentCategory}`, finalScore);
                localStorage.setItem(`informa_quiz_passed_${currentCategory}`, 'true');
                syncProgressToFirestore();

            } else {
                // --- Kondisi GAGAL ---
                scoreCircle.classList.add('failed');
                resultTitle.innerText = 'Belum Lulus 😔';
                resultMsg.innerText = `Skor Anda ${finalScore}, belum mencapai nilai minimum (${PASSING_GRADE}). Silakan pelajari ulang materi dan coba lagi.`;

                document.getElementById('result-actions-passed').style.display = 'none';
                document.getElementById('result-actions-failed').style.display = 'block';

                // Simpan skor terakhir untuk referensi, tapi TIDAK menyimpan flag lulus
                localStorage.setItem(`informa_quiz_${currentCategory}`, finalScore);
                syncProgressToFirestore();
            }
        }

        // --- Fitur Tema (Dark/Light Mode) ---
        function initTheme() {
            const savedTheme = localStorage.getItem('informa_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeButtonText(savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('informa_theme', newTheme);
            updateThemeButtonText(newTheme);
        }

        function updateThemeButtonText(theme) {
            const btn = document.getElementById('theme-btn');
            if (!btn) return;
            if (theme === 'light') {
                btn.innerHTML = '<i class="fa-solid fa-moon"></i>';
                btn.setAttribute('title', 'Mode Terang (Klik untuk Mode Gelap)');
                btn.setAttribute('aria-label', 'Mode Terang, klik untuk ganti ke Mode Gelap');
            } else {
                btn.innerHTML = '<i class="fa-solid fa-sun"></i>';
                btn.setAttribute('title', 'Mode Gelap (Klik untuk Mode Terang)');
                btn.setAttribute('aria-label', 'Mode Gelap, klik untuk ganti ke Mode Terang');
            }
        }

        // Jalankan saat halaman dimuat
        window.addEventListener('DOMContentLoaded', () => {
            initTheme();
            setTimeout(initQuiz, 800); // Simulasi loading singkat agar terlihat elegan
        });
    </script>
</body>
</html>
